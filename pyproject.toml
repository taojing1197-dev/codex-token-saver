[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-token-saver"
version = "0.2.0"
description = "Estimate repository context cost before loading files into Codex"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/taojing1197-dev/codex-token-saver"
Issues = "https://github.com/taojing1197-dev/codex-token-saver/issues"

[project.scripts]
codex-context-budget = "context_budget:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["context_budget"]
